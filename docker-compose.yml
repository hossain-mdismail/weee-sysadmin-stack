heredoc> services:
  db:
    image: mariadb:10.11
    container_name: weee_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal_net

  app:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: weee_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./app:/var/www/html
    networks:
      - internal_net

volumes:
  db_data:

networks:
  internal_net:
    driver: bridge

